{% extends 'master.html' %}

{% block title %}DunnoRPG - Logowanie{% endblock %}

{% block content %}
<style>
  #login-form label {
    text-shadow: none;
    -webkit-text-stroke: 1px black;
    paint-order: stroke fill;
  }
</style>
<div class="text-center mt-3">
  <h1 class="c-gold txt-shadow">Logowanie</h1>
  
    <form id="login-form" class="f-size-150 mt-5 card-body c-gold" method="post">
      {% csrf_token %}
        {{ form.as_p }}
          <input class="btn btn-success btn-lg mt-4 p-3" type="submit" value="Zaloguj się">
    </form>

    <a href="{% url 'home' %}" class="btn btn-dark btn-outline-warning home-btn mt-5">Powrót do strony głównej</a>
    <p class="c-gold txt-shadow fw-bold" style="margin-top: 15vh;">Nie masz jeszcze konta?</p>
    <a href="{% url 'signup' %}" class="btn btn-primary">Zarejestruj się</a><br>

</div>
{% endblock %}
