{% extends 'master.html' %}

{% block title %}Zdjęcia | DunnoRPG{% endblock title %}

{% block content %}
{% include 'top_bar.html' %}

<div id='iframe-card' class="container position-fixed m-0 p-0 pb-3 mt-0 d-none"
    style="top: 5%; left: 5%; z-index: 2000; width: 90%; height: 90vh;">
    <div class="row h-100">
        <div class="col-12 h-100">
            <button class='btn btn-dark btn-outline-danger w-100' onclick="hideImagePreview()">X Zamknij podgląd zdjęcia X</button>
            <iframe src="" class="border border-warning w-100 h-100 bg-dark" id="image-iframe" allow="autoplay"></iframe>
        </div>
    </div>
</div>

<div class="container mt-3">
    <div class="row">
        <div class="col text-center c-gold h5">
            {{ current_chapter }}
        </div>
    </div>
    <form method="GET" class="row justify-content-center" data-dynamic-search data-results-target="#images-results">
        <input
            class="col-12 col-md bg-dark border border-warning rounded c-gold text-center p-2 m-1"
            type="text"
            name="search-input"
            value="{{ search_value }}"
            placeholder="Szukaj po nazwie zdjecia">
        <button class="col-5 col-sm-4 col-md-2 btn btn-dark btn-outline-warning m-1 c-gold" type="submit">Szukaj</button>
    </form>
</div>

<div id="images-results">
    {% include 'dunnorpg/images_results.html' %}
</div>

<script>
    function showImagePreview(previewUrl) {
        const iframe = document.getElementById("image-iframe")
        const iframeCard = document.getElementById("iframe-card")

        iframe.src = previewUrl
        iframeCard.classList.remove("d-none")
    }

    function hideImagePreview() {
        const iframe = document.getElementById("image-iframe")
        const iframeCard = document.getElementById("iframe-card")

        iframe.src = ""
        iframeCard.classList.add("d-none")
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`
        const parts = value.split(`; ${name}=`)
        if (parts.length === 2) {
            return parts.pop().split(';').shift()
        }
        return ""
    }

    document.getElementById("images-results").addEventListener("click", async function(event) {
        const button = event.target.closest(".image-visible-toggle")
        if (!button) {
            return
        }

        button.disabled = true

        try {
            const response = await fetch(button.dataset.toggleUrl, {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                    "X-Requested-With": "XMLHttpRequest",
                },
            })

            if (response.status === 200) {
                const isVisible = button.dataset.visible === "true"
                const nextVisible = !isVisible

                button.dataset.visible = nextVisible ? "true" : "false"
                button.classList.toggle("btn-success", nextVisible)
                button.classList.toggle("btn-danger", !nextVisible)
            }
        } finally {
            button.disabled = false
        }
    })

    document.getElementById('tb-info').classList.remove('btn-outline-warning')
    document.getElementById('tb-info').classList.add('btn-outline-primary')
</script>

{% endblock content %}
